name: Android APK Oluştur

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Klasör Düzenle ve Derle
        run: |
          mkdir -p src
          cp -n *.tsx *.ts src/ 2>/dev/null || true
          cp -n *.css src/ 2>/dev/null || true
          npm install
          npm run build
          npx cap add android || true
          npx cap sync android

      - name: APK Derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: santralbayi-v1.0-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
